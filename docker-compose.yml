# GRIDS - GNSS-Resilient Intelligent Dead Reckoning System
#
#   docker compose up --build
#   dashboard: http://localhost:5173      api docs: http://localhost:8000/docs
#
services:
  backend:
    build:
      context: ./backend
    container_name: grids-backend
    ports:
      - "8000:8000"
    environment:
      GRIDS_DATABASE_URL: sqlite:////app/data/grids.db
      GRIDS_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      GRIDS_DEFAULT_RATE_HZ: "10"
      GRIDS_ML_CORRECTION_DEFAULT: "0"
      # Map matching works fully offline with the synthetic road network.
      # Set to "1" to also query OpenStreetMap (optional, needs internet).
      GRIDS_ENABLE_OSM: "0"
    volumes:
      - grids_data:/app/data
      - grids_ml:/app/ml_artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: grids-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  grids_data:
    name: grids_data
  grids_ml:
    name: grids_ml
